# 固定 compose 项目名：不随仓库目录改名漂移（卷名稳定，改名不丢数据）
name: lovelybuddy

services:
  postgres:
    image: ${LOVELYBUDDY_PG_IMAGE:-pgvector/pgvector:pg16}
    container_name: lovelybuddy-postgres
    environment:
      POSTGRES_USER: lovelybuddy
      POSTGRES_PASSWORD: lovelybuddy
      POSTGRES_DB: lovelybuddy
    ports:
      # 只绑本机，避开常见的 5432
      - "127.0.0.1:5433:5432"
    volumes:
      - lovelybuddy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lovelybuddy -d lovelybuddy"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  lovelybuddy_pgdata:
