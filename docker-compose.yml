services:
  postgres:
    image: ${SKYI_PG_IMAGE:-pgvector/pgvector:pg16}
    container_name: skyi-postgres
    environment:
      POSTGRES_USER: skyi
      POSTGRES_PASSWORD: skyi
      POSTGRES_DB: skyi
    ports:
      # 只绑本机，避开常见的 5432
      - "127.0.0.1:5433:5432"
    volumes:
      - skyi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyi -d skyi"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  skyi_pgdata:
