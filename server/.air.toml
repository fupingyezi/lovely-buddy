root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./bin/skyi-server ./cmd/skyi-server"
  bin = "./bin/skyi-server"
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "bin", "gen", "queries"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = true
