name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go vet + test（含 pgvector 服务）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: skyi
          POSTGRES_PASSWORD: skyi
          POSTGRES_DB: skyi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skyi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: vet & test
        working-directory: server
        run: go vet ./... && go test ./...
        env:
          SKYI_TEST_DB_DSN: postgres://skyi:skyi@127.0.0.1:5432/skyi?sslmode=disable

  frontend:
    name: 前端 typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: apps/desktop
        run: pnpm typecheck
      - name: vitest
        working-directory: apps/desktop
        run: pnpm test
      - name: build
        working-directory: apps/desktop
        run: pnpm build

  commitlint:
    name: commit 规范检查
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
